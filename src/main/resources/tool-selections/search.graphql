# Curated override, refined here around a named fragment. Two things are going on.
#
# First, the union: `search` returns SearchResult = Movie | Person | TvShow, and a
# union field is invalid without a selection, so the generated document fails at
# the server with SubselectionRequired. Choosing fields across union members needs
# inline fragments and a judgement about which members matter, and a person makes
# that judgement when writing this file.
#
# Second, the shape: MovieCard is the contract for what a "movie, briefly" means in
# this application, and Class 8's Java record mirrors it field for field. The same
# shape appears in three forms: a fragment (GraphQL), a record (Java) and a JSON
# schema (the model's format instructions).
query Tool_search($query: String!) {
  search(query: $query) {
    __typename
    ... on Movie  { ...MovieCard }
    ... on TvShow { id title startYear rating }
    ... on Person { id name }
  }
}
fragment MovieCard on Movie { id title releaseYear rating }
